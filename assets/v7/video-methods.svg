    <text x="70" y="151" font-size="41" fill="#165DA7" font-weight="700">教师参考手册里的两种具体方法</text>
    <text x="70" y="220" font-size="25" fill="#165DA7" font-weight="700">design-broll-animation</text><text x="70" y="266" font-size="29" fill="#163753">根据脚本或画面需求生成B-roll动画、装饰性动效和视觉包装，帮助A</text><text x="70" y="312" font-size="29" fill="#163753">gent将静态内容转成可插入视频的动态片段。</text><text x="70" y="394" font-size="25" fill="#165DA7" font-weight="700">video-shotcraft</text><text x="70" y="440" font-size="29" fill="#163753">提供镜头配方、视觉风格、动态样片和Remotion成片模板，帮助Ag</text><text x="70" y="486" font-size="29" fill="#163753">ent自动完成分镜、动画、网页截图、2.5D运镜、字幕、BGM、音效</text><text x="70" y="532" font-size="29" fill="#163753">和节奏卡点。</text><path d="M70 620H1130" stroke="#c5d9ec"/>
    <text x="70" y="662" font-size="21" fill="#526d86">来源：《AI视频与创作 Skill 参考手册》· ZC-0222附件正文</text></g></svg>