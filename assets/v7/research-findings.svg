<path d="M30 30h16v126H30z" fill="#F12E49"/>
<g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#18344e">
<text x="75" y="88" fill="#165DA7" font-size="22" font-weight="700">以明 AI 研究院 · 郑策作品档案</text>
<text x="1120" y="88" text-anchor="end" fill="#60758a" font-size="20">2026.07.13</text>
<text x="75" y="154" font-size="37" font-weight="700">从案例比较，到五条规律</text>
<text x="75" y="198" font-size="22" fill="#60758a">原文节选｜三、可复用规律</text>
<path d="M75 226H1120" stroke="#cfdfec" stroke-width="2"/>
<rect x="75" y="254" width="1050" height="82" fill="#F4F8FC"/>
<rect x="75" y="254" width="5" height="82" fill="#165DA7"/>
<text x="101" y="294" font-size="27" font-weight="700">1. 现场产出比单纯听课更重要</text>
<rect x="75" y="351" width="1050" height="82" fill="#F4F8FC"/>
<rect x="75" y="351" width="5" height="82" fill="#165DA7"/>
<text x="101" y="391" font-size="27" font-weight="700">2. 免费活动用于引流，付费活动用于筛选</text>
<rect x="75" y="448" width="1050" height="82" fill="#F4F8FC"/>
<rect x="75" y="448" width="5" height="82" fill="#165DA7"/>
<text x="101" y="488" font-size="27" font-weight="700">3. 垂直主题比泛AI活动更容易转化</text>
<rect x="75" y="545" width="1050" height="82" fill="#F4F8FC"/>
<rect x="75" y="545" width="5" height="82" fill="#165DA7"/>
<text x="101" y="585" font-size="27" font-weight="700">4. 传播内容要提前设计</text>
<rect x="75" y="642" width="1050" height="82" fill="#F4F8FC"/>
<rect x="75" y="642" width="5" height="82" fill="#165DA7"/>
<text x="101" y="682" font-size="27" font-weight="700">5. 真正利润通常发生在活动之后</text>
<path d="M75 779H1120" stroke="#cfdfec" stroke-width="2"/>
<text x="75" y="818" font-size="20" fill="#165DA7">提交文档节选 · 重新排版</text>
<text x="75" y="849" font-size="17" fill="#60758a">来源：ZC-0099 对应文档《AI线下活动市场调研报告》｜呈现报告的分析归纳</text></g></svg>