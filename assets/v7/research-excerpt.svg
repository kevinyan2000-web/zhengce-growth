<rect x="75" y="564" width="5" height="172" fill="#165DA7"/>
<text x="101" y="604" font-size="27" font-weight="700">工作坊/黑客松型</text>
<text x="101" y="645" font-size="23">以AdventureX、真格基金AI游戏黑客松、腾讯青科实训营为代表，</text>
<text x="101" y="680" font-size="23">强调现场实操、作品产出、人才筛选和项目孵化。</text>
