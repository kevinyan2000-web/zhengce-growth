<text x="101" y="294" font-size="27" font-weight="700">大型大会型</text>
<text x="101" y="335" font-size="23">以WAIC、百度Create、荣耀开发者大会为代表，</text>
<text x="101" y="370" font-size="23">核心目标是品牌传播、产品发布和生态建设。</text>
<rect x="75" y="409" width="1050" height="137" fill="#F4F8FC"/>
<rect x="75" y="409" width="5" height="137" fill="#165DA7"/>
<text x="101" y="449" font-size="27" font-weight="700">专业峰会型</text>
<text x="101" y="490" font-size="23">以AICon、DACon、工业AI大会为代表，</text>
<text x="101" y="525" font-size="23">依靠专业内容、门票、赞助和企业客户线索实现商业化。</text>
