<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img">
<title>让专业方向变成可以讨论的方案</title>
<rect width="1200" height="1160" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="18" fill="#165DA7"/>
<rect x="0" y="18" width="100" height="6" fill="#F12E49"/>
<g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="62" y="84" font-size="24" font-weight="700" fill="#165DA7">课堂重点整理 · 依据录音文字</text>
<text x="62" y="157" font-size="42" font-weight="700" fill="#132C49">让专业方向变成可以讨论的方案</text>
<text x="62" y="207" font-size="25" fill="#5D718A">2026.10.14 · 周中课程 · 郑策的课堂实践</text>
<rect x="62" y="250" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="250" width="5" height="174" fill="#165DA7"/>
<text x="88" y="299" font-size="29" font-weight="700" fill="#F12E49">01</text>
<text x="149" y="299" font-size="29" font-weight="700" fill="#165DA7">先追问产品为什么值得做</text>
<text x="149" y="346" font-size="28" fill="#203B59">教师追问给谁用、为什么有必要、与其他办法有什么区别，再讨论怎样实</text>
<text x="149" y="385" font-size="28" fill="#203B59">现。</text>
<rect x="62" y="444" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="444" width="5" height="174" fill="#165DA7"/>
<text x="88" y="493" font-size="29" font-weight="700" fill="#F12E49">02</text>
<text x="149" y="493" font-size="29" font-weight="700" fill="#165DA7">把自然资源方向拆成阶段</text>
<text x="149" y="540" font-size="28" fill="#203B59">围绕勘探、建设、开采、闭矿、修复，以及修复后的价值，逐段寻找值得</text>
<text x="149" y="579" font-size="28" fill="#203B59">研究的问题。</text>
<rect x="62" y="638" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="638" width="5" height="174" fill="#165DA7"/>
<text x="88" y="687" font-size="29" font-weight="700" fill="#F12E49">03</text>
<text x="149" y="687" font-size="29" font-weight="700" fill="#165DA7">回应学生从何入手的疑问</text>
<text x="149" y="734" font-size="28" fill="#203B59">先借助课堂回放和AI梳理提纲，再与专业人士交流、校验，把方向变成</text>
<text x="149" y="773" font-size="28" fill="#203B59">可讨论的方案。</text>
<rect x="62" y="832" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="832" width="5" height="174" fill="#165DA7"/>
<text x="88" y="881" font-size="29" font-weight="700" fill="#F12E49">04</text>
<text x="149" y="881" font-size="29" font-weight="700" fill="#165DA7">发现表达优势，也给出用途</text>
<text x="149" y="928" font-size="28" fill="#203B59">教师肯定郑策面对镜头时自然、有松弛感；建议记录项目思考、请教与师</text>
<text x="149" y="967" font-size="28" fill="#203B59">生互动。</text>
<text x="62" y="1071" font-size="23" fill="#5D718A">内容为课堂文字转述，不是逐字引语或课堂截图。</text>
<text x="62" y="1112" font-size="21" fill="#5D718A">以明AI研究院 · 智学工坊 | 来源：V11 及相关记录</text>
</g></svg>