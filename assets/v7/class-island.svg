<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img">
<title>换一种解释，再把小岛设计拆开</title>
<rect width="1200" height="1160" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="18" fill="#165DA7"/>
<rect x="0" y="18" width="100" height="6" fill="#F12E49"/>
<g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
<text x="62" y="84" font-size="24" font-weight="700" fill="#165DA7">课堂重点整理 · 依据录音文字</text>
<text x="62" y="157" font-size="42" font-weight="700" fill="#132C49">换一种解释，再把小岛设计拆开</text>
<text x="62" y="207" font-size="25" fill="#5D718A">2026.09.27 · 周末正课 · 郑策的课堂实践</text>
<rect x="62" y="250" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="250" width="5" height="174" fill="#165DA7"/>
<text x="88" y="299" font-size="29" font-weight="700" fill="#F12E49">01</text>
<text x="149" y="299" font-size="29" font-weight="700" fill="#165DA7">学生把理解困难提出来</text>
<text x="149" y="346" font-size="28" fill="#203B59">原先的游戏比喻不容易理解，郑策主动请求换一种说法。</text>
<rect x="62" y="444" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="444" width="5" height="174" fill="#165DA7"/>
<text x="88" y="493" font-size="29" font-weight="700" fill="#F12E49">02</text>
<text x="149" y="493" font-size="29" font-weight="700" fill="#165DA7">老师改用熟悉的场景</text>
<text x="149" y="540" font-size="28" fill="#203B59">借虚拟世界和身份解释交互：访问者不只读介绍，还能进入场景、探索内</text>
<text x="149" y="579" font-size="28" fill="#203B59">容。</text>
<rect x="62" y="638" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="638" width="5" height="174" fill="#165DA7"/>
<text x="88" y="687" font-size="29" font-weight="700" fill="#F12E49">03</text>
<text x="149" y="687" font-size="29" font-weight="700" fill="#165DA7">学生用自己的话确认理解</text>
<text x="149" y="734" font-size="28" fill="#203B59">郑策尝试复述让别人探索自己主页的想法，并用虚拟试衣、看车等场景理</text>
<text x="149" y="773" font-size="28" fill="#203B59">解互动。</text>
<rect x="62" y="832" width="1076" height="174" fill="#E8F2FB"/>
<rect x="62" y="832" width="5" height="174" fill="#165DA7"/>
<text x="88" y="881" font-size="29" font-weight="700" fill="#F12E49">04</text>
<text x="149" y="881" font-size="29" font-weight="700" fill="#165DA7">下一步任务拆到可落笔</text>
<text x="149" y="928" font-size="28" fill="#203B59">先写详细Markdown设计：世界观是什么，怎样成长或收集，再把</text>
<text x="149" y="967" font-size="28" fill="#203B59">玩法与具体AI能力对应起来。</text>
<text x="62" y="1071" font-size="23" fill="#5D718A">内容为课堂文字转述，不是逐字引语或课堂截图。</text>
<text x="62" y="1112" font-size="21" fill="#5D718A">以明AI研究院 · 智学工坊 | 来源：V06 及相关记录</text>
</g></svg>